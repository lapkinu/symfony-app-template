---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{ github.ref }}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{ github.ref }},mode=max

      - name: Start services
        run: docker compose up --wait --no-build

      - name: Check HTTP reachability
        run: curl --fail-with-body http://localhost

      - name: Validate Composer configuration
        run: docker compose exec -T php composer validate --strict

      - name: Check Symfony application
        run: docker compose exec -T php bin/console about

      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    needs:
      - application
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Enable when ARM64 production images are required.
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4
      #   with:
      #     platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          platforms: linux/amd64
          # Enable ARM64 together with the QEMU step above when required:
          # platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - production-image

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'

    environment:
      name: production

    concurrency:
      group: production
      cancel-in-progress: false

    permissions: {}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -d -m 0700 "${HOME}/.ssh"

          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 0600 "${HOME}/.ssh/deploy_key"

          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/known_hosts"

      - name: Deploy production
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP: ${{ vars.DEPLOY_APP }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          if [[ ! "${DEPLOY_APP}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid DEPLOY_APP"
            exit 1
          fi

          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid DEPLOY_SHA"
            exit 1
          fi

          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/deploy-${DEPLOY_APP} '${DEPLOY_SHA}'"
